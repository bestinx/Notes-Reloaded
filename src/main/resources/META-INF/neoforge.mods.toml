[[mods]]
    modId="notes"
    version="${mod_version}"
    displayName="Notes Reloaded"
    displayURL="https://www.curseforge.com/minecraft/mc-mods/notes"
    authors="ChaosTheDude, Notes Reloaded fork"
    description='''
    Clientside in-game notepad. Revived fork: scrollable viewer, search, in-game
    settings, unsaved-change protection and a refreshed UI.
    '''

[[dependencies.notes]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.notes]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
